name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Run evaluation (rule mode, no credentials needed)
        run: python eval/run_eval.py --mode rule

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fail if recall drops below threshold
        run: |
          python - <<'PY'
          import json, subprocess, sys

          out = subprocess.run(
              [sys.executable, "eval/run_eval.py", "--mode", "rule", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          metrics = json.loads(out)

          recall_min = 0.70
          fpr_max = 0.05
          failed = False

          print(f"recall = {metrics['recall']:.1%} (min {recall_min:.0%})")
          print(f"fpr    = {metrics['fpr']:.1%} (max {fpr_max:.0%})")

          if metrics["recall"] < recall_min:
              print("::error::召回率低于阈值")
              failed = True
          if metrics["fpr"] > fpr_max:
              print("::error::误报率高于阈值")
              failed = True

          sys.exit(1 if failed else 0)
          PY
