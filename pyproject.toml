[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustguard"
version = "0.1.0"
description = "Trustworthiness guard for LLM agent outputs — a triple-challenge checker (provenance / assumption / contradiction)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Junsen Li" }]
keywords = ["llm", "agent", "trustworthy-ai", "hallucination", "evaluation"]

dependencies = []

[project.optional-dependencies]
# 真实 LLM 接入（OpenAI 兼容接口：百炼 / DeepSeek / Ollama / vLLM 均可）
llm = ["requests>=2.28.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
trustguard = "trustguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/trustguard"]
